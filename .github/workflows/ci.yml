name: CI

# Triggers the workflow on push or pull request events
on: [push, pull_request]

permissions: {}

jobs:
  bats-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install greadlink
      if: startsWith(runner.os, 'macOS')
      run: brew install coreutils
    - name: Test code
      run: test/run
      env:
        # --tap + --jobs causes TAP plan count mismatches on both Linux and macOS.
        TEST_JOBS: 1

  # ubuntu-24.04 ships Bash 5.2 and macos-14 Bash 3.2; cover Bash 5.3 in a container.
  bats-test-bash-5-3:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: true
    - name: Test code (Bash 5.3)
      run: |
        docker run --rm -v "$PWD":/repo -w /repo -e TEST_JOBS=1 \
          bash@sha256:c058ddf59fee36dad43d3df8ed80fcbc2166bcdfe50069ee546a9e4c7125d466 \
          bash -c 'apk add --no-cache git coreutils procps util-linux grep sed findutils \
            && git config --global --add safe.directory "*" \
            && bash --version | head -1 \
            && test/run'

  build-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.12
    - name: Install docs dependencies
      run: python3 -m pip install -r docs/requirements.txt
    - name: Build the docs
      run: sphinx-build -W -b html docs docs/_build/html

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install shellcheck
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y shellcheck shfmt

    # Check modified files in this PR; on push events (no PR refs) check the last commit
    - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
      with:
        extra-args: ${{ github.event_name == 'pull_request' && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--last-commit' }}
        show-verbose-logs: false

  lint-differential:
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: ShellCheck
        name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@f51c7c0d32777d00de777131d25918617a246415 # v5.5.7
        with:
          exclude-path: "vendor/**"
          token: ${{ secrets.GITHUB_TOKEN }}
